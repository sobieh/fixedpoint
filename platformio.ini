[platformio]
default_envs = native

[common]
build_flags =
    -Wall
    -DUNITY_INCLUDE_DOUBLE

[env:native]
platform    = native
build_flags =
    ${common.build_flags}
    -std=c++17
    -Wextra


[env:mega2560]
platform      = atmelavr
board         = megaatmega2560
framework     = arduino
build_unflags = -std=gnu++11
build_flags   =
    ${common.build_flags}
    -std=gnu++17
test_speed    = 115200


[env:blackpill_f411]
platform      = ststm32
board         = blackpill_f411ce
framework     = arduino
build_unflags = -std=gnu++11

build_flags   =
    ${common.build_flags}
    -std=gnu++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USB_MANUFACTURER="STMicroelectronics"
    -D USB_PRODUCT="\"BLACKPILL_F411CE\""
    -D HAL_PCD_MODULE_ENABLED

monitor_speed    = 115200
test_speed       = 115200
test_timeout     = 120
upload_protocol  = stlink

